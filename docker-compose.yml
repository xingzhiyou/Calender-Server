services:
  calendar-server:
    build: .
    container_name: calendar-server
    ports:
      - "5040:8080"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - UPLOAD_DIR=/app/uploads
      - DATA_DIR=/app/data
